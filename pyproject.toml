[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fooddemand-ai"
version = "1.0.0"
description = "End-to-end retail demand forecasting with temporal validation, backtesting, FastAPI and MLOps."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Cássio Henrique"}]
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]
data = [
  "kaggle>=1.6,<2",
  "matplotlib>=3.9,<4",
]
tracking = ["mlflow>=2.18,<4"]
dashboard = [
  "plotly>=5.24,<7",
  "requests>=2.32,<3",
  "streamlit>=1.40,<2",
]
publish = ["huggingface-hub>=0.26,<2"]
portfolio = [
  "huggingface-hub>=0.26,<2",
  "kaggle>=1.6,<2",
  "matplotlib>=3.9,<4",
  "mlflow>=2.18,<4",
  "plotly>=5.24,<7",
  "requests>=2.32,<3",
  "streamlit>=1.40,<2",
]

[project.scripts]
fooddemand-train = "fooddemand.train:main"
fooddemand-eda = "fooddemand.eda:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
