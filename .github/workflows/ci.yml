name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: End-to-end synthetic smoke test
        run: |
          python scripts/generate_demo_data.py --output-dir /tmp/fooddemand-demo --days 90
          python -m fooddemand.train \
            --data-dir /tmp/fooddemand-demo \
            --backtest-folds 2 \
            --validation-days 10 \
            --model-out /tmp/fooddemand.joblib \
            --report-out /tmp/metrics.json \
            --model-card-out /tmp/MODEL_CARD.md
          test -s /tmp/fooddemand.joblib
          test -s /tmp/metrics.json
          test -s /tmp/MODEL_CARD.md

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t fooddemand-ai .
      - name: Build dashboard image
        run: docker build -f Dockerfile.dashboard -t fooddemand-dashboard .
